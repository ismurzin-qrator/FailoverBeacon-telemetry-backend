name: beacon

x-logging: &logging
  driver: local

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      # Users come from users.d only; otherwise the image rewrites the default user.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set in .env}
      CLICKHOUSE_MIGRATOR_PASSWORD: ${CLICKHOUSE_MIGRATOR_PASSWORD:?set in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-backups:/backups
      # File by file: a directory mount would hide the image's listen_host config.
      - ./clickhouse/config.d/access.xml:/etc/clickhouse-server/config.d/access.xml:ro
      - ./clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/config.d/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
    logging: *logging

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: beacon:local
    environment:
      BEACON_REGISTRY: /etc/beacon/registry.json
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD}
    volumes:
      - ${BEACON_REGISTRY_FILE:?set in .env}:/etc/beacon/registry.json:ro
      - geo:/var/lib/beacon/geo:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - clickhouse
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    # The host network keeps the real source address of IPv6 clients.
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - ingest
    restart: unless-stopped
    logging: *logging

  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: beacon-grafana:local
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1m
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - clickhouse
    restart: unless-stopped
    logging: *logging

  tools:
    image: beacon:local
    profiles: [tools]
    # Writes the host's registry file.
    user: root
    environment:
      BEACON_REGISTRY: /etc/beacon/registry.json
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: migrator
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATOR_PASSWORD}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ${BEACON_REGISTRY_FILE}:/etc/beacon/registry.json
      - geo:/var/lib/beacon/geo
      - ./grafana/dashboards:/etc/beacon/dashboards:ro
    depends_on:
      - clickhouse
    logging: *logging

volumes:
  clickhouse-data:
  clickhouse-backups:
  geo:
  grafana-data:
