[project]
name = "beacon"
version = "0.1.0"
description = "Receives telemetry uploads and stores them in ClickHouse."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.5",
    "clickhouse-connect[async]==1.11.0",
    "gunicorn==26.2.0",
    "jsonschema-rs==0.60.3",
    "maxminddb==3.2.0",
]

[project.scripts]
beacon = "beacon.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# A seeded generator keeps load test runs comparable.
"scripts/load_test.py" = ["S311"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
