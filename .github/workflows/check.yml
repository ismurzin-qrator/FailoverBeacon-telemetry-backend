name: check

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src scripts/load_test.py
      - run: uv run pytest
      - run: uv run beacon schema check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/integration.sh

  stack:
    runs-on: ubuntu-latest
    env:
      PASSWORD: Ci-Password-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Configure as the README says
        run: |
          sed "s/PASSWORD=\$/PASSWORD=$PASSWORD/" .env.example > .env
          mkdir tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout tls/server.key -out tls/server.crt
      - run: docker compose up -d --build
      - run: docker compose run --rm tools beacon migrate
      - run: docker compose run --rm tools beacon registry load
      - run: docker compose run --rm tools beacon dashboards import
      - run: docker compose run --rm tools beacon backup
      - name: Ingest stores uploads through nginx
        run: |
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/healthz
          curl -skf https://127.0.0.1/v1/health
          uv run scripts/load_test.py https://127.0.0.1/v1/beacon/bbbbbbbbbbbbbbbbbbbbbbbbbb \
            --levels 1 --seconds 3
          events=$(docker compose exec -T clickhouse clickhouse-client --user migrator \
            --password "$PASSWORD" -q 'SELECT count() FROM telemetry.events')
          test "$events" -gt 0
      - name: Grafana reads ClickHouse
        run: curl -sf -u "admin:$PASSWORD" http://127.0.0.1:3000/api/datasources/uid/clickhouse/health
      - if: failure()
        run: docker compose logs
