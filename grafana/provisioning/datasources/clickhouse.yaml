apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana
      defaultDatabase: telemetry
      dialTimeout: 10
      queryTimeout: 30
      maxOpenConns: 4
      maxIdleConns: 2
    secureJsonData:
      password: $__file{/run/secrets/clickhouse_grafana_password}
