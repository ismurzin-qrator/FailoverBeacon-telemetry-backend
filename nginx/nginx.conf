worker_processes auto;
# Error lines carry the client address and the key; the access log shows the status instead.
error_log /dev/stderr crit;

events {
    worker_connections 4096;
}

http {
    server_tokens off;

    map $uri $logged_path {
        ~^/v1/beacon/  /v1/beacon/;
        default        $uri;
    }
    log_format beacon '$time_iso8601 $request_method $logged_path $status '
                      '$request_length $bytes_sent $request_time';
    access_log /dev/stdout beacon;

    # An abuse ceiling: many clients share one CGNAT address.
    limit_req_zone $binary_remote_addr zone=per_ip:20m rate=200r/s;
    limit_req_status 429;

    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    upstream ingest {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Above the 20 s deadline of ingest, so its 503 comes first.
        proxy_read_timeout 25s;

        location ~ ^/v1/beacon/[^/]+$ {
            limit_req zone=per_ip burst=1000 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://ingest;
        }

        location = /v1/health {
            limit_req zone=per_ip burst=1000 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://ingest;
        }

        location / {
            return 404;
        }
    }
}
